# Guard budget configuration (see guard.py).
#
# daily_usd: per gateway alias, per local calendar day.
# A model without an entry falls back to "default";
# no entry and no default means no limit for that model.

warn_ratio: 0.8

daily_usd:
  default: 5.00
  lead: 10.00
  # Evidence-run aliases (operator word 2026-07-20 «делай все 4» —
  # R1 top-up without waiting for calibration; the night's series hit
  # the default $5 wall on lead-sonnet, Guard refused correctly):
  lead-sonnet: 20.00
  judge-sonnet: 20.00
  # Passthrough aliases (t-075, API-window prep): caps proposed by Lead
  # for the 2-3 day Claude Code / ANTHROPIC_API_KEY window; operator to
  # adjust. warn_ratio above fires at 80% of each as usual.
  claude-fable-5: 150.00
  claude-sonnet-5: 50.00
  claude-opus-4-8: 50.00
  claude-haiku-4-5-20251001: 10.00
  claude-sonnet-4-6: 20.00

# quota_windows: sliding-window TOKEN quotas (t-018), one or more
# {window_seconds, limit_tokens} walls per gateway alias. Each window
# is a true rolling window over prompt_tokens+completion_tokens in
# requests.db, not a calendar bucket -- Groq free-tier TPD is itself a
# rolling 24h window (t-015, CURRENT_CONTEXT.md), so a calendar-day
# reset would under-enforce it. No "default" fallback: a model absent
# here has no token wall. No cross-model fallback either way (Lead
# constraint, t-018): a wall blocks, it never redirects to another
# model.
#
# middle-groq (llama-3.3-70b-versatile) limits per spec (TPD) and
# empirical Groq docs (TPM, console.groq.com/docs/rate-limits,
# checked 2026-07-09 -- the spec named the 60s TPM window but not its
# token count):
#   TPD 100000 tokens / 24h, TPM 12000 tokens / 60s.
# builder-groq (openai/gpt-oss-120b) limit per spec: TPM 8000
# tokens / 60s (matches CURRENT_CONTEXT.md task-5 usage report and
# Groq's published TPM for this model; its TPD is 200000/24h per Groq
# docs but that wall was not asked for here and is left out).
#
# Failure detector for the wall itself (rule 10(в), D-0049): weekly
# calibration check 13 -- any NEW rejected/failure_class=tooling event
# carrying a Groq 429 TPM/TPD error dated AFTER this wall landed means
# the wall leaked (evidence to fix or tighten it, D-0063).
quota_windows:
  middle-groq:
    - window_seconds: 86400
      limit_tokens: 100000
    - window_seconds: 60
      limit_tokens: 12000
  builder-groq:
    - window_seconds: 60
      limit_tokens: 8000

# quota_pools (t-324, external review P0 recommendation #5): several
# gateway aliases can share ONE provider key's physical quota ceiling
# (e.g. two Groq aliases hitting the same free-tier key). A pool wall
# sums prompt_tokens+completion_tokens across ALL of its `aliases` in
# the window, same sliding-window semantics as quota_windows above.
# Checked AFTER each alias's own quota_windows wall (guard.py,
# Guard.async_pre_call_hook): a per-alias block fires first. Absent
# key = no pools configured, no-op (same "missing means no wall"
# convention as quota_windows). Uncomment and adjust aliases/limits to
# the actual shared provider key:
#
# quota_pools:
#   groq_free_key_1:
#     aliases: [middle-groq, builder-groq]
#     windows:
#       - window_seconds: 86400
#         limit_tokens: 100000

# projection (t-324, external review P0): closes the gap where the
# walls above only look at ALREADY-LOGGED spend, so one large request
# could cross a $ budget or a token quota mid-flight. Absent entirely
# (as in this file today) == byte-for-byte old behavior for the $
# wall; the TOKEN wall's projection (quota_windows/quota_pools above)
# always estimates the current request's PROMPT tokens regardless of
# this section (guard.py module docstring), but its OUTPUT side stays
# invisible (assumed 0) until assumed_max_output_tokens is set here.
# Uncomment and adjust to enable:
#
# projection:
#   # Upper bound assumed for a request's completion tokens when it
#   # has no explicit max_tokens. Either a single number (applies to
#   # every alias) or a {default, <alias>: N} map (alias overrides
#   # default) -- same convention as daily_usd above.
#   assumed_max_output_tokens:
#     default: 2048
#     middle-groq: 1024
#   # Explicit $ prices per 1000 tokens, per alias. An alias listed
#   # here gets $-projection blocking (spent + projected_usd >=
#   # budget); an alias with a daily_usd entry but NO price here
#   # either fail-closes (below) or gets a once-per-day
#   # "no usd_prices entry" warning -- Guard never guesses a price.
#   usd_prices:
#     lead-sonnet:
#       prompt_per_1k: 0.003
#       completion_per_1k: 0.015
#   # Aliases that must REFUSE a request (HTTP 429) rather than run it
#   # unprojected when no usd_prices entry exists -- for
#   # expensive/production aliases where an unprojected large request
#   # is not an acceptable risk.
#   fail_closed_aliases: []
